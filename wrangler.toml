name = "travel-time"
main = "src/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "travel-time-db"
database_id = "e3ad7c11-cea5-4c48-b80b-ebfc8b62a3bc"
migrations_dir = "migrations"

# Branch previews (Workers Builds runs `wrangler preview` for non-main branches)
# use a separate database so test builds never touch real trip data.
[[previews.d1_databases]]
binding = "DB"
database_name = "travel-time-db-preview"
database_id = "5e0306f9-64ed-4919-ab89-8865a5bf4c61"
